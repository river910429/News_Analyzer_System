name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build -t rag-api ./services/api-gateway
          docker build -t rag-worker ./services/nlp-worker
          docker build -t rag-frontend ./services/frontend
          docker build -t rag-mcp ./services/mcp-server
