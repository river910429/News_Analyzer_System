services:
  # 1. Redis (任務佇列)
  redis-queue:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag-network

  # 2. Database (PostgreSQL + pgvector)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # 自動建表腳本
    networks:
      - rag-network

  # 3. Object Storage (MinIO)
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    networks:
      - rag-network

  # 4. API Gateway
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # 讓 Linux 上的容器也能連到宿主機的 Ollama
    volumes:
      - ./services/api-gateway/src:/app/src
      - hf_cache:/root/.cache/huggingface # 模型只下載一次，重建容器也不用重抓
    depends_on:
      redis-queue:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - rag-network

  # 5. ETL Worker (處理向量化)
  nlp-worker:
    build: ./services/nlp-worker
    deploy:
      resources:
        limits:
          memory: 4G # 向量模型比較吃記憶體
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/nlp-worker/src:/app/src
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis-queue:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - rag-network

  # 6. MCP Server (讓 Claude Code 等 MCP client 直接查詢財報)
  mcp-server:
    build: ./services/mcp-server
    ports:
      - "8001:8001"
    environment:
      - API_URL=http://api-gateway:8000
    volumes:
      - ./services/mcp-server/src:/app/src
    depends_on:
      - api-gateway
    networks:
      - rag-network

  # 7. Frontend
  frontend:
    build: ./services/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./services/frontend/src:/app/src
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  hf_cache:
